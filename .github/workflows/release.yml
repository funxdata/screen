name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate versions
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          name=$(jq -r '.name' dytes.json)
          version=$(jq -r '.version' dytes.json)
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')

          if [ "${cargo_version}" != "${version}" ]; then
            echo "Cargo.toml 版本 ${cargo_version} 与 dytes.json 版本 ${version} 不一致" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 dytes.json 版本 ${version} 不一致" >&2
            exit 1
          fi

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "发布 ${name} ${version}"

  quality:
    name: Quality
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgdk-pixbuf-2.0-dev \
            libatk1.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  publish:
    name: Publish ${{ matrix.platform }}
    needs: [prepare, quality]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [linux, windows, macos]
    runs-on: ${{ matrix.platform == 'windows' && 'windows-latest' || matrix.platform == 'macos' && 'macos-latest' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgdk-pixbuf-2.0-dev \
            libatk1.0-dev \
            libpango1.0-dev \
            libcairo2-dev

      - name: Build
        shell: bash
        run: cargo build --release --locked

      - name: Prepare upload directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload manifest
          case "${{ matrix.platform }}" in
            linux)   cp target/release/screen upload/screen.bin ;;
            windows) cp target/release/screen.exe upload/screen.exe ;;
            macos)   cp target/release/screen upload/screen.app ;;
          esac
          cp dytes.json manifest/

      - name: Upload binary
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: upload
          destination_dir: app/${{ needs.prepare.outputs.name }}/${{ needs.prepare.outputs.version }}/${{ matrix.platform }}
          endpoint: https://s3.api.upyun.com

      - name: Upload manifest
        uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.UPYUN_API_KEY }}
          aws_secret_access_key: ${{ secrets.UPYUN_API_SECRET }}
          aws_bucket: ${{ secrets.UPYUN_BUCKET }}
          source_dir: manifest
          destination_dir: app/${{ needs.prepare.outputs.name }}
          endpoint: https://s3.api.upyun.com
